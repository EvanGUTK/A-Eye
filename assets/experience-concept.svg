<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">A-Eye interaction concept</title><desc id="desc">A selected monitor has a thin solid orange border. A pinned region highlights a dropdown problem. A compact voice dock names the agent and project. An evidence panel shows the last sent crop and its age. This is a design concept, not implemented software.</desc>
