<text x="54" y="110" fill="#F3F0EA" font-size="40" font-weight="700">Your application is the canvas.</text>
<text x="56" y="145" fill="#B5B6B9" font-size="18">A precise focus frame. A quiet voice dock. Evidence you can inspect.</text>
<text x="1115" y="54" fill="#B5B6B9" font-size="13">DESIGN CONCEPT · NOT BUILT</text>
