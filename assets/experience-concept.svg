<text x="56" y="797" fill="#FF8A3D" font-size="14" font-weight="700">01 / SCOPE YOU CAN SEE</text>
<text x="56" y="830" fill="#F3F0EA" font-size="19">One monitor. One clear boundary.</text>
<text x="56" y="860" fill="#B5B6B9" font-size="15"><tspan x="56">Solid orange frame on the selected display.</tspan><tspan x="56" dy="24">The inner frame marks the transmitted crop.</tspan></text>
<text x="520" y="797" fill="#FF8A3D" font-size="14" font-weight="700">02 / CONVERSATION THAT STAYS PUT</text>
<text x="520" y="830" fill="#F3F0EA" font-size="19">Name the agent. Name the project.</text>
<text x="520" y="860" fill="#B5B6B9" font-size="15"><tspan x="520">A small dock keeps routing and stop visible.</tspan><tspan x="520" dy="24">Your application keeps the visual priority.</tspan></text>
<text x="1004" y="797" fill="#FF8A3D" font-size="14" font-weight="700">03 / HONEST EVIDENCE</text>
<text x="1004" y="830" fill="#F3F0EA" font-size="19">Show what was actually sent.</text>
<text x="1004" y="860" fill="#B5B6B9" font-size="15"><tspan x="1004">Inspect the crop, sequence, and age.</tspan><tspan x="1004" dy="24">Live capture is not live understanding.</tspan></text>
<path d="M56 927H1384" stroke="#3D4248"/>
<text x="56" y="957" fill="#B5B6B9" font-size="12">Concept omits additional OS capture indicators for clarity. Native implementation must preserve required system indicators.</text>
<text x="1257" y="957" fill="#F3F0EA" font-size="14" font-weight="700">A-Eye / 2026</text>
</g></svg>