[package]
name = "a-eye-spike-02-codex-oauth"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A-Eye spike part 02: OAuth 2.0 + PKCE flow against a local mock provider, keyring storage"
publish = false

# Standalone spike: not part of any workspace.
[workspace]

[dependencies]
# Versions pinned exactly (checked on crates.io 2026-10-15).
base64 = "=0.23.1"
keyring = "=4.2.0" # default feature `v1` = Secret Service (zbus) on Linux
rand = "=0.10.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
time = { version = "=0.3.55", features = ["formatting"] }
url = "=2.5.8"
spike-01-credential-store = { path = "../part-01-credential-store" }
zeroize = "=1.9.1" # already pinned by part 01; wipe serialized credential buffers
