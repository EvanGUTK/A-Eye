[package]
name = "spike-17-windows-capture"
version = "0.1.0"
edition = "2021"
publish = false
description = "A-Eye spike 17: Windows.Graphics.Capture monitor frame -> PNG"

# Standalone spike: not part of any workspace.
[workspace]

[dependencies]
png = "=0.18.1"
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]
