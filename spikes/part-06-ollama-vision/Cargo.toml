[package]
name = "spike-06-ollama-vision"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Synthetic-only local Ollama vision evidence and latency spike"

[workspace]

[dependencies]
# Reuse the repository's tested versions; Cargo.lock pins transitive dependencies.
base64 = "=0.23.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
