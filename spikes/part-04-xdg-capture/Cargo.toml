[package]
name = "spike-04-xdg-capture"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "spike-04-xdg-capture"
description = "A-Eye spike 04: XDG ScreenCast portal -> PipeWire frame -> PNG"

# Standalone spike: not part of any workspace.
[workspace]

[features]
# Developer-only: exposes pw::capture_synthetic_node and builds the pw_selftest
# bin. Off by default so the library API cannot capture without a StartedSession.
dev-selftest = []

[[bin]]
name = "pw_selftest"
path = "src/bin/pw_selftest.rs"
required-features = ["dev-selftest"]

[[bin]]
name = "spike-04-xdg-capture"
path = "src/main.rs"

[dependencies]
libc = "=0.2.190"
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "screencast"] }
pipewire = "=0.10.1"
png = "=0.18.1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
