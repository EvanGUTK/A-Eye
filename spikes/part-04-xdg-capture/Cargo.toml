[package]
name = "spike-04-xdg-capture"
version = "0.1.0"
edition = "2021"
publish = false
description = "A-Eye spike 04: XDG ScreenCast portal -> PipeWire frame -> PNG"

# Standalone spike: not part of any workspace.
[workspace]

[dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "screencast"] }
pipewire = "=0.10.1"
png = "=0.18.1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
