[package]
name = "spike-18-windows-overlay"
version = "0.1.0"
edition = "2021"
publish = false
description = "A-Eye spike 18: Win32 layered, click-through, non-activating orange border overlay"

# Standalone spike: not part of any workspace.
[workspace]

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
